name: kvsai startup smoke test

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/startup-smoke.yml'

permissions:
  contents: read

jobs:
  launch:
    name: Launch on Android ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch published APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            adb install -r out/kvsai-release.apk
            adb logcat -c
            adb shell am start -W -n app.kvsai.chat/ai.iskra.chat.KvsEntry
            sleep 5
            PID="$(adb shell pidof app.kvsai.chat 2>/dev/null | tr -d '\r' || true)"
            adb logcat -d '*:V' > /tmp/kvsai-logcat.txt
            if [ -z "$PID" ]; then
              DETAILS="$(grep -A50 -B8 -E 'FATAL EXCEPTION|Process: app\.kvsai\.chat|SecurityException' /tmp/kvsai-logcat.txt \
                | tail -100 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-6000)"
              echo "::error title=kvsai startup crash::$DETAILS"
              cat /tmp/kvsai-logcat.txt
              echo 'kvsai process is not alive after startup' >&2
              exit 1
            fi
            if grep -A40 -B5 -E 'FATAL EXCEPTION.*|Process: app\.kvsai\.chat' /tmp/kvsai-logcat.txt; then
              echo 'Fatal startup exception detected' >&2
              exit 1
            fi
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            echo "kvsai stayed alive with pid $PID"
