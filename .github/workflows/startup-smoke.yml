name: kvsai startup smoke test

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/startup-smoke.yml'

permissions:
  contents: read

jobs:
  launch:
    name: Launch on Android ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch published APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            RESULT_FILE="startup-result-${{ matrix.api }}.txt"
            INSTALL_OUTPUT="$(adb install -r out/kvsai-release.apk 2>&1)"
            INSTALL_STATUS=$?
            printf '%s\n' "$INSTALL_OUTPUT"
            if [ "$INSTALL_STATUS" -ne 0 ]; then
              SAFE="$(printf '%s' "$INSTALL_OUTPUT" | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-6000)"
              printf 'FAIL|APK installation failed|%s\n' "$SAFE" > "$RESULT_FILE"
              exit 0
            fi
            adb logcat -c || true
            START_OUTPUT="$(adb shell am start -W -n app.kvsai.chat/ai.iskra.chat.KvsEntry 2>&1)"
            START_STATUS=$?
            printf '%s\n' "$START_OUTPUT"
            if [ "$START_STATUS" -ne 0 ]; then
              SAFE="$(printf '%s' "$START_OUTPUT" | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-6000)"
              printf 'FAIL|Launcher command failed|%s\n' "$SAFE" > "$RESULT_FILE"
              exit 0
            fi
            sleep 5
            PID="$(adb shell pidof app.kvsai.chat 2>/dev/null | tr -d '\r' || true)"
            adb logcat -d '*:V' > /tmp/kvsai-logcat.txt 2>&1 || true
            if [ -z "$PID" ]; then
              DETAILS="$(grep -A50 -B8 -E 'FATAL EXCEPTION|Process: app\.kvsai\.chat|SecurityException' /tmp/kvsai-logcat.txt \
                | tail -100 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-6000)"
              printf 'FAIL|kvsai startup crash|%s\n' "$DETAILS" > "$RESULT_FILE"
              cat /tmp/kvsai-logcat.txt
              exit 0
            fi
            if grep -A40 -B5 -E 'FATAL EXCEPTION.*|Process: app\.kvsai\.chat' /tmp/kvsai-logcat.txt; then
              DETAILS="$(grep -A40 -B5 -E 'FATAL EXCEPTION.*|Process: app\.kvsai\.chat' /tmp/kvsai-logcat.txt \
                | tail -80 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-6000)"
              printf 'FAIL|Fatal startup exception|%s\n' "$DETAILS" > "$RESULT_FILE"
              exit 0
            fi
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            echo "kvsai stayed alive with pid $PID"
            printf 'PASS|kvsai stayed alive|pid %s\n' "$PID" > "$RESULT_FILE"

      - name: Report startup result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT_FILE="startup-result-${{ matrix.api }}.txt"
          if [[ ! -f "$RESULT_FILE" ]]; then
            echo "::error title=Emulator harness failed::No startup result was produced"
            exit 1
          fi
          IFS='|' read -r STATE TITLE DETAILS < "$RESULT_FILE"
          echo "$STATE: $TITLE — $DETAILS"
          if [[ "$STATE" != "PASS" ]]; then
            echo "::error title=$TITLE::$DETAILS"
            exit 1
          fi
