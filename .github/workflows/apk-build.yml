name: Build DFRoot APK

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'DFRoot/**'
      - '.github/workflows/apk-build.yml'

defaults:
  run:
    working-directory: DFRoot

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-apk:
    name: APK
    needs: build-lkms
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Create throwaway signing keystore
        run: |
          keytool -genkeypair -keystore keystore.jks -storetype JKS \
            -storepass df-ksu -keypass df-ksu -alias df-ksu \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DFRoot"
          printf 'KEYSTORE_FILE=../keystore.jks\nKEYSTORE_PASSWORD=df-ksu\nKEY_ALIAS=df-ksu\nKEY_PASSWORD=df-ksu\n' > signing.properties

      - name: Download DF LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: DFRoot/app/src/main/jni/ko/

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/DFRoot_*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/DFRoot_*.apk out/ 2>/dev/null || true
          ls -l out

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: DFRoot-APK
          path: DFRoot/out/*.apk
          if-no-files-found: error

      # The APK is pushed back into the branch so it can be downloaded straight
      # from the repository (repo root, so it does not retrigger this workflow).
      - name: Publish APKs into the branch
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p out
          rm -f out/*.apk
          cp DFRoot/out/*.apk out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit"
          else
            git commit -m "build: DFRoot APK (run ${{ github.run_number }})"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
