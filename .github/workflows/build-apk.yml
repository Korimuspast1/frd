name: Build kvsai APK

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # AOSP's deliberately public test key keeps personal test builds
      # update-compatible without storing a private production key.
      - name: Prepare stable test signing key
        shell: bash
        run: |
          set -euo pipefail
          AOSP_REV=045a3d6a3e359633a14853a5a5e1e4f2a11cbdae
          BASE="https://raw.githubusercontent.com/aosp-mirror/platform_build/${AOSP_REV}/target/product/security"
          curl --fail --silent --show-error --location "$BASE/testkey.pk8" -o testkey.pk8
          curl --fail --silent --show-error --location "$BASE/testkey.x509.pem" -o testkey.x509.pem
          openssl pkcs8 -inform DER -nocrypt -in testkey.pk8 -out testkey.pem
          openssl pkcs12 -export -in testkey.x509.pem -inkey testkey.pem \
            -out kvsai-test.p12 -name kvsai -passout pass:kvsai-test
          cat > signing.properties <<'EOF'
          KEYSTORE_FILE=kvsai-test.p12
          KEYSTORE_TYPE=PKCS12
          KEYSTORE_PASSWORD=kvsai-test
          KEY_ALIAS=kvsai
          KEY_PASSWORD=kvsai-test
          EOF

      - name: Verify live weather API contract
        shell: bash
        run: |
          set -euo pipefail
          GEO="$(curl --fail --retry 3 --silent --show-error --get \
            --data-urlencode 'name=Москва' --data 'count=1' --data 'language=ru' --data 'format=json' \
            'https://geocoding-api.open-meteo.com/v1/search')"
          LAT="$(jq -er '.results[0].latitude' <<<"$GEO")"
          LON="$(jq -er '.results[0].longitude' <<<"$GEO")"
          curl --fail --retry 3 --silent --show-error --get \
            --data "latitude=$LAT" --data "longitude=$LON" \
            --data 'daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max' \
            --data 'timezone=auto' --data 'forecast_days=4' \
            'https://api.open-meteo.com/v1/forecast' \
            | jq -e '.daily.weather_code[1] != null and .daily.temperature_2m_max[1] != null'

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)" artifacts/kvsai-release.apk
          cp "$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)" artifacts/kvsai-debug.apk
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: kvsai-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release APK in the branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          rm -f out/*-release.apk out/SHA256SUMS.txt
          cp artifacts/kvsai-release.apk out/kvsai-release.apk
          (cd out && sha256sum kvsai-release.apk > SHA256SUMS.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out
          if git diff --cached --quiet; then
            echo "APK is unchanged"
          else
            git commit -m "build: publish kvsai APK (run ${{ github.run_number }})"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
