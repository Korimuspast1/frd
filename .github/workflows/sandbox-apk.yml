name: Build Sandbox APK

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'sandbox/**'
      - '.github/workflows/sandbox-apk.yml'

permissions:
  contents: write

concurrency:
  group: sandbox-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  KEYSTORE_FILE: sandbox-testkey.p12
  KEYSTORE_PASSWORD: android
  KEY_ALIAS: sandbox
  KEY_PASSWORD: android

jobs:
  build:
    name: Собрать APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME не задан — берём стандартный путь раннера"
            export ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          echo "SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          # нужная платформа для compileSdk 35
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Ключ подписи (AOSP testkey)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/platform.pk8 \
            https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8
          curl -fsSL -o /tmp/platform.x509.pem \
            https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem
          openssl pkcs8 -inform DER -nocrypt -in /tmp/platform.pk8 -out /tmp/platform.key
          openssl pkcs12 -export \
            -in /tmp/platform.x509.pem -inkey /tmp/platform.key \
            -name "$KEY_ALIAS" -out "$KEYSTORE_FILE" \
            -password "pass:$KEYSTORE_PASSWORD"
          cat > signing.properties <<PROPS
          KEYSTORE_FILE=$KEYSTORE_FILE
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEYSTORE_TYPE=PKCS12
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          PROPS
          ls -la "$KEYSTORE_FILE" signing.properties

      - name: Сборка
        working-directory: sandbox
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Диагностика при ошибке
        if: failure()
        run: |
          {
            echo "=== ХВОСТ ЛОГА СБОРКИ ==="
            # только строки, где Gradle объясняет причину
            grep -nE "^\* What went wrong|^\* Where|^Caused by|^> |^e: |^FAILURE|error:|Unsupported|Could not|was not found|requires|version " /tmp/build.log | head -60 || true
            echo; echo "=== ОКРУЖЕНИЕ ==="
            grep -n "compileSdk\|minSdk\|targetSdk" sandbox/app/build.gradle.kts || true
            java -version 2>&1 | head -2
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/platforms" 2>/dev/null || true
            ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          } > /tmp/diag.txt 2>&1
          cat /tmp/diag.txt

      - name: Причина ошибки в репозиторий
        if: failure()
        run: |
          mkdir -p out
          {
            echo "# Причина ошибки сборки $(date -u)"
            echo
            echo "## Gradle / Java"
            (cd sandbox && ./gradlew --version 2>&1 | head -12) || true
            echo
            echo "## Вывод без стек-трейсов"
            grep -vE "^\s+at |^\s*$" /tmp/build.log 2>/dev/null | head -80 || echo "нет лога"
          } > out/build-cause.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/build-cause.log
          git commit -m "ci: причина ошибки сборки" || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || true

      - name: Лог ошибки в репозиторий
        if: failure()
        run: |
          mkdir -p out
          {
            echo "# Ошибка сборки $(date -u)"
            echo '```'
            cat /tmp/build.log 2>/dev/null || echo "нет /tmp/build.log"
            echo '```'
            cat /tmp/diag.txt 2>/dev/null || true
          } > out/build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/build-error.log
          git commit -m "ci: лог ошибки сборки" || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || true

      - name: Лог сборки (артефакт)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            /tmp/build.log
            /tmp/diag.txt
            sandbox/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Проверка подписи
        run: |
          set -euo pipefail
          APK=$(find sandbox/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK=$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" || true
          ls -lh "$APK"

      - name: Выложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-apk
          path: sandbox/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Положить APK в репозиторий
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find sandbox/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" out/sandbox.apk
          cd out
          sha256sum sandbox.apk > sandbox.apk.sha256
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/sandbox.apk out/sandbox.apk.sha256
          git commit -m "build(sandbox): APK $(date -u +%Y-%m-%d-%H%M)" || echo "нет изменений"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="sandbox-v1.0.$(date -u +%Y%m%d%H%M)"
          gh release create "$TAG" out/sandbox.apk \
            --title "Песочница $TAG" \
            --notes "Пиксельная физическая песочница для Android.

          **Установка:** скачай \`sandbox.apk\` ниже и открой на телефоне (разреши установку из этого источника).

          **Что внутри:**
          - 28 материалов: песок, камень, вода, лава, лёд, снег, нефть, кислота, порох и другие
          - реальная клеточная физика: плотности, текучесть, тепло, испарение и замерзание
          - автоматические реакции: лава + вода = камень и пар, песок + лава = стекло, порох + огонь = взрыв
          - панель материалов снизу, кисть, ластик, закрепление блоков, сохранение мира
          - вертикальный интерфейс под телефон" \
            || echo "релиз уже существует"
          gh release view "$TAG" --json url --jq '.url' || true
